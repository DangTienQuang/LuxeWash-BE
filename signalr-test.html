<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartWash SignalR Realtime Tester</title>
    <!-- Thư viện SignalR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .log-box { 
            background: #1e1e1e; color: #00ff00; padding: 15px; 
            height: 400px; overflow-y: scroll; 
            border-radius: 5px; font-family: Consolas, monospace; 
            font-size: 14px; margin-top: 10px;
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 8px; }
        .info { color: #88ccff; }
        .success { color: #00ff00; }
        .error { color: #ff5555; }
        .event { color: #ffffaa; }
        
        input { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.btn-danger { background: #dc3545; }
        button.btn-danger:hover { background: #c82333; }
        button.btn-secondary { background: #6c757d; }
        button.btn-secondary:hover { background: #5a6268; }
        
        .controls { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚗 SmartWash SignalR Tester (FE Simulator)</h2>
        <p>Đây là công cụ giả lập Frontend để test luồng Realtime qua SignalR cho LaneDisplayHub.</p>
        
        <div>
            <label><strong>Hub URL:</strong></label>
            <input type="text" id="hubUrl" value="http://localhost:5031/hubs/lane-display" />
        </div>
        
        <div>
            <label><strong>Access Token (của tài khoản Staff/Manager có BranchId):</strong></label>
            <input type="text" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." />
            <small><i>Lưu ý: Bạn lấy token này khi gọi API Login trên Swagger.</i></small>
        </div>
        
        <div class="controls">
            <button onclick="connect()">🔌 Connect</button>
            <button class="btn-danger" onclick="disconnect()">🔴 Disconnect</button>
            <button class="btn-secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>
        
        <h3 style="margin-top: 30px;">Terminal Logs:</h3>
        <div id="logs" class="log-box">
            <div class="info">Ready to connect...</div>
        </div>
    </div>

    <script>
        let connection = null;

        function log(message, data = null, type = 'info') {
            const logs = document.getElementById("logs");
            const entry = document.createElement("div");
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString();
            let html = `[${time}] <strong>${message}</strong>`;
            
            if (data) {
                html += `<br/><pre style="margin: 5px 0 0 0; color: #ddd; font-size: 13px;">${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            entry.innerHTML = html;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function clearLogs() {
            document.getElementById("logs").innerHTML = "";
        }

        async function connect() {
            const token = document.getElementById("token").value.trim();
            let hubUrl = document.getElementById("hubUrl").value.trim();

            if (!token) {
                log("Lỗi: Vui lòng nhập Access Token!", null, "error");
                return;
            }

            if (connection) {
                log("Đã kết nối hoặc đang trong quá trình kết nối.", null, "info");
                return;
            }

            // Fix Http/Https depending on dev environment
            if(hubUrl.includes("localhost") && !hubUrl.includes("http")) {
                 hubUrl = "http://" + hubUrl;
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, { accessTokenFactory: () => token })
                .withAutomaticReconnect()
                .configureLogging(signalR.LogLevel.Information)
                .build();

            // Đăng ký nhận sự kiện từ Backend
            connection.on("ReceiveInitialState", (data) => {
                log("📩 Nhận sự kiện: ReceiveInitialState", data, "event");
            });

            connection.on("ReceiveLaneUpdate", (data) => {
                log("📩 Nhận sự kiện: ReceiveLaneUpdate", data, "event");
            });

            connection.on("ReceiveBarrierCommand", (data) => {
                log("📩 Nhận sự kiện: ReceiveBarrierCommand (MỞ BARIE)", data, "event");
            });

            try {
                log("Đang kết nối tới Hub...", null, "info");
                await connection.start();
                log("✅ Kết nối thành công! (Bạn có thể gọi API check-in qua camera trên Swagger để test sự kiện)", null, "success");
            } catch (err) {
                log("❌ Lỗi kết nối: " + err.toString(), null, "error");
                connection = null;
            }
        }

        async function disconnect() {
            if (connection) {
                await connection.stop();
                connection = null;
                log("🔴 Đã ngắt kết nối.", null, "info");
            }
        }
    </script>
</body>
</html>
